# OTA 升级配置文件
# 修改此文件无需重新编译程序，重启应用即可生效

# OTA 脚本路径配置
script:
  # OTA 脚本的完整路径
  ota_script_path: "/home/linaro/ota/scripts/ota"

# 服务器配置
server:
  # 源服务器（存放升级包的服务器）
  from_ip: "192.168.20.204"
  from_path: "/home/konka-admin/workspace"
  from_user: "konka-admin"
  from_pass: "123456" # 源服务器密码

  # 包配置
  package_name: "tangpa"

# 客户端配置
client:
  # 目标设备（要升级的设备）
  to_ip: "192.168.127.10"
  to_user: "root"
  to_pass: "root" # 目标设备密码

# 高级配置（可选）
advanced:
  # 升级操作超时时间（毫秒）
  upgrade_timeout: 3000

  # 恢复操作超时时间（毫秒）
  recovery_timeout: 3000

# ROS2 配置
ros2:
  # ROS2 环境setup脚本路径
  # 根据实际安装的ROS2版本修改（humble/foxy/galactic等）
  ros2_setup: "/opt/ros/humble/setup.bash"
