# OTA 升级配置文件
# 修改此文件无需重新编译程序，重启应用即可生效

# 凭证配置（Base64编码存储）
# 注意：密码使用Base64编码进行混淆，不是真正的加密
credentials:
  # from_pass: "123456" 的 Base64 编码
  from_pass: "MTIzNDU2"

  # to_pass: "root" 的 Base64 编码
  to_pass: "cm9vdA=="

# 升级相关配置
upgrade:
  # 升级脚本路径
  script_path: ""

  # 超时时间（毫秒）
  timeout: 3000

  # 升级前是否弹出确认对话框
  confirm_before_upgrade: true

# 恢复相关配置
recovery:
  # 恢复脚本路径
  script_path: ""

  # 超时时间（毫秒）
  timeout: 3000

  # 恢复前是否弹出确认对话框
  confirm_before_recovery: true

# 最新版本信息
latest_version:
  # 最新版本号
  script_path: ""

  # 超时时间（毫秒）
  timeout: 3000

# 当前版本信息
current_version:
  # 当前版本号
  script_path: ""

  # 超时时间（毫秒）
  timeout: 3000
  # 界面配置
ui:
  # 窗口标题
  window_title: "S100 控制器升级工具"

  # 升级按钮文本
  upgrade_button_text: "升级"

  # 升级中按钮文本
  upgrading_button_text: "升级中..."

# 日志配置
logging:
  # 是否启用日志
  enabled: true

  # 日志文件路径
  log_path: "/var/log/ota_upgrade.log"

  # 日志级别 (debug, info, warning, error)
  log_level: "info"
