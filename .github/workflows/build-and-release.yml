name: Build and Release OTA

on:
    push:
        branches:
            - main
    workflow_dispatch:
        # 允许手动触发

jobs:
    build:
        name: Build OTA Application
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Qt
              uses: jurplel/install-qt-action@v3
              with:
                  version: "5.15.2"
                  host: "linux"
                  target: "desktop"
                  arch: "gcc_64"
                  modules: "qtcharts qtwebengine"

            - name: Display Qt version
              run: |
                  qmake --version
                  which qmake

            - name: Create build directory
              run: mkdir -p build

            - name: Build application
              run: |
                  cd build
                  qmake ../OTA.pro CONFIG+=release
                  make -j$(nproc)

            - name: Verify build output
              run: |
                  ls -lh build/
                  ls -lh build/release/ || true
                  if [ -f build/release/OTA ]; then
                    echo "✓ OTA executable built successfully"
                    file build/release/OTA
                    ldd build/release/OTA || true
                  else
                    echo "✗ OTA executable not found"
                    exit 1
                  fi

            - name: Install linuxdeploy
              run: |
                  wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
                  chmod +x linuxdeploy-x86_64.AppImage
                  wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
                  chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

            - name: Create AppImage
              run: |
                  export QML_SOURCES_PATHS=.
                  export QMAKE=$(which qmake)
                  ./linuxdeploy-x86_64.AppImage \
                    --appdir AppDir \
                    --executable build/release/OTA \
                    --desktop-file OTA.desktop \
                    --icon-file OTA.svg \
                    --plugin qt \
                    --output appimage

            - name: Package release artifacts
              run: |
                  mkdir -p release

                  # 复制可执行文件
                  cp build/release/OTA release/

                  # 复制配置文件
                  cp config.yaml release/
                  cp README_CONFIG.md release/

                  # 复制 AppImage (如果存在)
                  if ls OTA*.AppImage 1> /dev/null 2>&1; then
                    cp OTA*.AppImage release/
                  fi

                  # 创建版本信息
                  echo "Version: ${GITHUB_REF#refs/tags/}" > release/VERSION
                  echo "Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release/VERSION
                  echo "Commit: $GITHUB_SHA" >> release/VERSION

                  # 创建压缩包
                  cd release
                  tar -czf ../OTA-linux-x64.tar.gz *
                  cd ..

                  ls -lh release/
                  ls -lh OTA-linux-x64.tar.gz

            - name: Generate checksums
              run: |
                  sha256sum OTA-linux-x64.tar.gz > OTA-linux-x64.tar.gz.sha256
                  if ls OTA*.AppImage 1> /dev/null 2>&1; then
                    sha256sum OTA*.AppImage > OTA.AppImage.sha256
                  fi

            - name: Upload to Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      OTA-linux-x64.tar.gz
                      OTA-linux-x64.tar.gz.sha256
                      OTA*.AppImage
                      OTA.AppImage.sha256
                  prerelease: false
                  body: |
                      🤖 **OTA 升级工具 ${{ github.ref_name }}**

                      📅 **更新时间:** ${{ github.event.head_commit.timestamp }}
                      🔗 **Commit:** ${{ github.sha }}
                      🌿 **分支:** ${{ github.ref_name }}
                      👤 **作者:** ${{ github.event.head_commit.author.name }}
                      🔢 **构建编号:** #${{ github.run_number }}

                      ---

                      ## 📦 下载方式

                      ### 推荐方式：AppImage
                      ```bash
                      # 1. 下载 AppImage 文件
                      wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OTA-x86_64.AppImage

                      # 2. 添加执行权限
                      chmod +x OTA-x86_64.AppImage

                      # 3. 运行
                      ./OTA-x86_64.AppImage
                      ```

                      ### 传统方式：tar.gz
                      ```bash
                      # 1. 下载并解压
                      wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/OTA-linux-x64.tar.gz
                      tar -xzf OTA-linux-x64.tar.gz
                      cd release

                      # 2. 安装 Qt5（如果未安装）
                      sudo apt-get install qt5-default  # Ubuntu/Debian

                      # 3. 运行
                      chmod +x OTA
                      ./OTA
                      ```

                      ---

                      ## ✨ 包含内容
                      - ✅ OTA 可执行文件（Linux x64）
                      - ✅ AppImage 独立包（推荐）
                      - ✅ 配置文件 config.yaml
                      - ✅ 配置说明 README_CONFIG.md
                      - ✅ SHA256 校验和文件

                      ## 🎯 特性
                      - ✅ 支持从 config.yaml 配置脚本路径
                      - ✅ 升级和恢复功能
                      - ✅ 实时显示执行进度
                      - ✅ 友好的用户界面

                      ## 🔐 文件校验
                      使用 SHA256 校验文件完整性：
                      ```bash
                      sha256sum -c OTA-linux-x64.tar.gz.sha256
                      sha256sum -c OTA.AppImage.sha256
                      ```

                      ## 📝 更新日志
                      查看完整更新日志：[CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
