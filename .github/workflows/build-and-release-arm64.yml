name: Build and Release OTA (ARM64)

on:
    push:
        branches:
            - main
    workflow_dispatch:
        # 允许手动触发

jobs:
    build:
        name: Build OTA Application - ARM64
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: arm64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build in ARM64 container
              run: |
                  docker run --rm --platform linux/arm64 \
                    -v ${{ github.workspace }}:/workspace \
                    -w /workspace \
                    arm64v8/ubuntu:22.04 \
                    bash -c "
                      set -e
                      apt-get update
                      DEBIAN_FRONTEND=noninteractive apt-get install -y \
                        qtbase5-dev \
                        qt5-qmake \
                        qttools5-dev-tools \
                        build-essential \
                        file
                      
                      mkdir -p build
                      cd build
                      qmake ../OTA.pro CONFIG+=release
                      make -j\$(nproc)
                      
                      echo '✓ Build completed'
                      file release/OTA
                      ls -lh release/
                    "

            - name: Fix file permissions
              run: |
                  sudo chown -R $USER:$USER build/

            - name: Verify build output
              run: |
                  ls -lh build/
                  ls -lh build/release/ || true
                  if [ -f build/release/OTA ]; then
                    echo "✓ OTA executable built successfully"
                    file build/release/OTA
                  else
                    echo "✗ OTA executable not found"
                    exit 1
                  fi

            - name: Package release artifacts
              run: |
                  mkdir -p release

                  # 复制可执行文件
                  cp build/release/OTA release/

                  # 复制配置文件
                  cp config.yaml release/
                  cp README_CONFIG.md release/

                  # 创建版本信息
                  echo "Version: ${GITHUB_REF#refs/tags/}" > release/VERSION
                  echo "Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release/VERSION
                  echo "Commit: $GITHUB_SHA" >> release/VERSION
                  echo "Architecture: arm64" >> release/VERSION

                  # 创建压缩包
                  cd release
                  tar -czf ../OTA-linux-arm64.tar.gz *
                  cd ..

                  ls -lh release/
                  ls -lh OTA-linux-arm64.tar.gz

            - name: Generate checksums
              run: |
                  sha256sum OTA-linux-arm64.tar.gz > OTA-linux-arm64.tar.gz.sha256

            - name: Upload to Release
              if: success()
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: latest
                  files: |
                      OTA-linux-arm64.tar.gz
                      OTA-linux-arm64.tar.gz.sha256
                  prerelease: true
                  body: |
                      🤖 **最新自动构建 - ARM64**

                      📅 **更新时间:** ${{ github.event.head_commit.timestamp }}
                      🔗 **Commit:** ${{ github.sha }}
                      🌿 **分支:** ${{ github.ref_name }}
                      👤 **作者:** ${{ github.event.head_commit.author.name }}
                      🔢 **构建编号:** #${{ github.run_number }}
                      🏗️ **架构:** ARM64

                      ---

                      ## 📦 下载方式

                      ```bash
                      wget https://github.com/${{ github.repository }}/releases/download/latest/OTA-linux-arm64.tar.gz
                      tar -xzf OTA-linux-arm64.tar.gz
                      cd release && chmod +x OTA && ./OTA
                      ```

                      ---

                      ## ✨ 包含内容
                      - ✅ OTA 可执行文件（Linux ARM64）
                      - ✅ 配置文件 config.yaml
                      - ✅ 配置说明 README_CONFIG.md
                      - ✅ SHA256 校验和文件

                      ## 🎯 特性
                      - ✅ 支持从 config.yaml 配置脚本路径
                      - ✅ 升级和恢复功能
                      - ✅ 实时显示执行进度
                      - ✅ 友好的用户界面

                      ## 🔐 文件校验
                      使用 SHA256 校验文件完整性：
                      ```bash
                      sha256sum -c OTA-linux-arm64.tar.gz.sha256
                      ```

                      ## 📝 更新日志
                      查看完整更新日志：[CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
